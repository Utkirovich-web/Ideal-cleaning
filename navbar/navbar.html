<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./navbar.css">
  </head>
  <body>
    <header>
      <div class="logo">

              class="image_white"
              src="../../assets/white_home_icon.svg"
              alt="icon"
            />

          </a>
        </div>
        <div class="order">
          <a href="#">
            <img
              class="image_black"
              src="../../assets/order_black_icon.svg"

            />
            <img
              class="image_white"
              src="../../assets/order_icon.svg"
              alt="icon"
            />
            <span> Buyurtmalar </span>
          </a>
        </div>
        <div class="customer">
          <a href="#"
            ><img
              class="image_black"
              src="../../assets/customer_icon.svg"
              alt="icon"
            />
            <img
              class="image_white"
              src="../../assets/white_customer_icon.svg"
              alt="icon"
            />
            <span> Mijozlar </span>
          </a>
        </div>
        <div class="marketing">
          <a href="#"
            ><img
              class="image_black"
              src="../../assets/marketing_icon.svg"

            />
            <img
              class="image_white"
              src="../../assets/white_marketing_icon.svg"
              alt="icon"
            /><span> SMA marketing </span>
          </a>
        </div>
        <div class="service">
          <a href="#"
            ><img
              class="image_black"
              src="../../assets/services_icon.svg"
              alt="icon"
            />

            <img
              class="image_white"
              src="../../assets/white_services_icon.svg"
              alt="icon"
            />
            <span> Xizmatlar </span></a
          >
        </div>
        <div class="settings">
          <a href="../settings/settings.html"
            ><img
              class="image_black"
              src="../../assets/settings_icon.svg"
              alt="icon"
            />

            <img
              class="image_white"
              src="../../assets/white_settings_icon.svg"
              alt="icon"
            /><span> Sozlamalar</span>
          </a>

          <div class="add_btn"><button>Buyurtma qo‘shish</button></div>
          <div class="search">
            <label for="search"
              ><img src="../../assets/search_icon.svg" alt="search icon"
            /></label>
            <input type="tel" id="search" name="search" placeholder="Search" />
          </div>
        </div>
        <div class="notification">
          <div class="hidden_card">
            <div class="admin">
              <img
                src="../../assets/large_profile_icon.svg"
                alt="large profile icon"
              /><span>Admin</span>

            <div class="line"></div>
            <div>
              <a href="../../components/settings/settings.html">
                <img src="../../assets/lock.svg" alt="lock icon" /><span

                >
              </a>
            </div>
            <div class="line"></div>
            <div>
              <a href="../../../index.html">
                <img src="../../assets/exit.svg" alt="exit icon" /><span
                  >Chiqish</span
                >
              </a>
            </div>
          </div>
          <img
            src="../../assets/notification_icon.svg"
            alt="notification icon"
          />
          <button class="profile_btn">
            <img src="../../assets/profile_icon.svg" alt="profile icon" />
          </button>
        </div>
      </div>
